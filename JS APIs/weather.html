<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>

    </div>
    <script>
        const div = document.querySelector('div')
        const API_key = '01c74fb80536c4fd14598332961183a5'
        const city_name = prompt("Enter the city name")
        fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city_name}&appid=${API_key}`)
            .then(Response => Response.json())
            .then(json => {
                div.innerHTML = `<img src='https://openweathermap.org/img/wn/${json.weather[0].icon}@2x.png' alt='img'>`
                console.log(json);
                console.log(json.weather[0].icon);

            })


    </script>
</body>

</html>
