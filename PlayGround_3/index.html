<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
 <div id='buttonCountainer'>
 </div>
  <script>
    let state = {
      count: 0
    }

    function onbuttonclick(){
      state.count++
      buttonComponentRender()
    }

    function buttonComponentRender(){
      document.getElementById('buttonCountainer').innerHTML = "";
      const render = buttonclicked(state.count);
      document.getElementById('buttonCountainer').appendChild(render);
      console.log(render)
    }

    function buttonclicked(count){
      const button = document.createElement('button')
      button.innerHTML = `Count: ${count}`
      button.setAttribute('onclick', 'onbuttonclick()')
      return button
    }

    buttonComponentRender()
  </script>
</body>
</html>
